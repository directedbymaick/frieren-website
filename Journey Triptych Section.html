<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Journey Triptych — Standalone Section</title>

<script src="https://unpkg.com/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --ink:      #2a2730;
    --ink-mute: rgba(42, 39, 48, 0.55);
    --ivory:    #f1ead9;
    --gold:     #b8945a;
  }
  html, body { background: var(--ivory); color: var(--ink); }
  body { font-family: 'Inter', system-ui, sans-serif; }
  .font-serif { font-family: 'Cormorant Garamond', 'Times New Roman', serif; }

  /* Reveal-on-scroll */
  .reveal-rise { opacity: 0; transform: translateY(80px);
    transition: opacity 1.1s ease-out, transform 1.1s cubic-bezier(.2,.7,.2,1); }
  .reveal-rise.in { opacity: 1; transform: translateY(0); }

  /* Panel hover */
  .triptych-panel { transition: transform .7s cubic-bezier(.2,.7,.2,1), filter .7s ease; }
  .triptych-panel:hover { transform: scale(1.04); filter: brightness(1.08); z-index: 2; }

  /* Button press */
  .btn-press { transition: transform .18s ease, box-shadow .25s ease; }
  .btn-press:hover { transform: translateY(-1px); }
  .btn-press:active { transform: translateY(0) scale(.985); }

  /* Tiny rune divider */
  .rune-line {
    display:inline-block; vertical-align: middle;
    width: 56px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<template id="__bundler_thumbnail" data-bg-color="#f1ead9">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect x="120" y="240" width="300" height="380" rx="32" fill="#3a2a48"/>
    <rect x="450" y="240" width="300" height="380" rx="32" fill="#8a5562"/>
    <rect x="780" y="240" width="300" height="380" rx="32" fill="#2b3a2a"/>
    <rect x="560" y="350" width="80" height="160" rx="40" fill="#0d0c12"/>
    <circle cx="600" cy="338" r="5" fill="#b8945a"/>
  </svg>
</template>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useEffect, useRef } = React;

/* ---------- Tiny inline icons ---------- */
const ChevronRight = (props) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"
       strokeLinecap="round" strokeLinejoin="round" {...props}>
    <path d="M9 6l6 6-6 6"/>
  </svg>
);
const RuneMark = (props) => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.4"
       strokeLinecap="round" strokeLinejoin="round" {...props}>
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 3v18M3 12h18"/>
  </svg>
);

/* ---------- Reveal-on-scroll hook ---------- */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { el.classList.add('in'); io.unobserve(el); } });
    }, { threshold: 0.18 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return ref;
}

/* ---------- The Section ---------- */
function JourneyTriptych() {
  const ref = useReveal();
  const panels = [
    {
      bg: `radial-gradient(120% 80% at 30% 20%, #1a1530 0%, transparent 55%),
           linear-gradient(180deg, #2b1f3a 0%, #6b3e54 40%, #d28a5e 70%, #f0c39a 100%)`,
      stars: true,
    },
    {
      bg: `radial-gradient(80% 60% at 50% 38%, #ffd485 0%, #f0a35c 20%, transparent 60%),
           linear-gradient(180deg, #2a2548 0%, #6b3e54 30%, #c97a4e 55%, #6e8a5c 75%, #2b3a2a 100%)`,
      stars: false,
    },
    {
      bg: `radial-gradient(120% 80% at 70% 20%, #1a1530 0%, transparent 55%),
           linear-gradient(180deg, #2b1f3a 0%, #533a55 35%, #8a5562 60%, #4d5a48 85%, #2a3a2a 100%)`,
      stars: true,
    },
  ];

  return (
    <section className="relative w-full" style={{ background: 'var(--ivory)' }}>
      <div ref={ref} className="reveal-rise relative max-w-[1536px] mx-auto px-4 sm:px-6 md:px-10 pt-24 md:pt-32 pb-24 md:pb-32">

        <div className="flex items-center gap-4 mb-8 md:mb-10">
          <span className="rune-line"></span>
          <span className="text-[11px] tracking-[0.32em] uppercase font-medium" style={{color:'var(--ink-mute)'}}>Chapter I</span>
          <RuneMark className="w-3.5 h-3.5" style={{color:'var(--gold)'}}/>
        </div>

        <div className="relative" style={{aspectRatio:'16 / 9'}}>
          <div className="absolute inset-0 grid gap-1.5 sm:gap-2 md:gap-2.5 lg:gap-3"
               style={{gridTemplateColumns:'repeat(3, 1fr)'}}>
            {panels.map((p, i) => (
              <div key={i}
                   className="triptych-panel relative overflow-hidden cursor-pointer rounded-[0.8rem] sm:rounded-[1rem] md:rounded-[1.4rem]"
                   style={{ background: p.bg, boxShadow:'0 20px 40px -20px rgba(20,15,10,0.35)' }}>
                <svg viewBox="0 0 400 250" preserveAspectRatio="none"
                     className="absolute inset-x-0 bottom-[12%] w-full h-[55%] opacity-90">
                  <path d={i%3===0
                    ? "M0,200 L60,110 L110,150 L160,80 L220,140 L280,90 L340,160 L400,120 L400,250 L0,250 Z"
                    : i%3===1
                    ? "M0,180 L70,100 L130,160 L200,70 L260,150 L320,110 L400,170 L400,250 L0,250 Z"
                    : "M0,150 L80,90 L140,140 L220,60 L290,140 L360,100 L400,150 L400,250 L0,250 Z"}
                    fill="rgba(15,10,30,0.85)"/>
                </svg>
                <svg viewBox="0 0 400 120" preserveAspectRatio="none"
                     className="absolute inset-x-0 bottom-0 w-full h-[35%]">
                  <g fill="rgba(8,12,8,0.95)">
                    {Array.from({length: 5}).map((_, k) => {
                      const x = 40 + k*75 + (i*12);
                      const h = 55 + ((k+i)%3)*22;
                      return (
                        <path key={k} d={`M${x},120 L${x-14},${120-h*0.55} L${x-8},${120-h*0.55} L${x-12},${120-h*0.8} L${x-5},${120-h*0.8} L${x},${120-h} L${x+5},${120-h*0.8} L${x+12},${120-h*0.8} L${x+8},${120-h*0.55} L${x+14},${120-h*0.55} Z`}/>
                      );
                    })}
                  </g>
                </svg>
                {p.stars && (
                  <div className="absolute inset-0 pointer-events-none" style={{top:0, height:'45%'}}>
                    {Array.from({length: 12}).map((_, k) => (
                      <span key={k} className="absolute rounded-full"
                            style={{
                              top: `${Math.random()*80}%`,
                              left: `${Math.random()*100}%`,
                              width: `${1+Math.random()*2}px`,
                              height: `${1+Math.random()*2}px`,
                              background: '#fff',
                              opacity: 0.4+Math.random()*0.5,
                              boxShadow: '0 0 4px rgba(255,255,255,0.6)',
                            }}/>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* Center capsule */}
          <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-[3]
                          flex items-center justify-center rounded-full"
               style={{
                 width: 'clamp(60px, 7vw, 100px)',
                 height: 'clamp(100px, 12vw, 170px)',
                 background: 'linear-gradient(180deg, #1a1820 0%, #0d0c12 100%)',
                 boxShadow: '0 30px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06) inset, 0 1px 0 rgba(255,255,255,0.15) inset',
               }}>
            <RuneMark className="w-5 h-5 md:w-6 md:h-6" style={{color:'rgba(184,148,90,0.85)'}}/>
            <span className="absolute -top-2 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full"
                  style={{background:'rgba(184,148,90,0.55)', boxShadow:'0 0 6px rgba(184,148,90,0.8)'}}/>
          </div>

          {/* Bottom-left caption + CTA */}
          <div className="absolute bottom-3 md:bottom-6 left-3 md:left-6 z-[3] max-w-[38%] md:max-w-[28%]">
            <p className="text-[10px] sm:text-[11px] md:text-[12px] leading-relaxed text-white/90 mb-2 md:mb-3 drop-shadow">
              A travelogue of a thousand quiet years — the spells, the kettle,
              the bread, the friends she keeps forgetting to forget.
            </p>
            <button type="button"
                    className="btn-press flex items-center bg-white text-[#1a1530] rounded-full pl-3 sm:pl-4 pr-4 sm:pr-5 py-1.5 sm:py-2 gap-1.5 sm:gap-2 text-[11px] sm:text-[12px] md:text-[13px] tracking-[0.04em] font-medium">
              Read the codex
              <ChevronRight className="w-3.5 h-3.5"/>
            </button>
          </div>

          {/* Bottom-right quote */}
          <div className="absolute bottom-3 md:bottom-6 right-3 md:right-8 z-[3] text-right">
            <p className="font-serif italic text-white/85 text-[11px] sm:text-[13px] md:text-[15px] drop-shadow">
              So time forgets to hurry.
            </p>
          </div>
        </div>
      </div>
    </section>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<JourneyTriptych/>);
</script>
</body>
</html>
