[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — any unknown path serves index.html so the React
# app can render. Harmless for the current single-page setup,
# necessary if client-side routing is added later.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the hashed asset bundles Vite emits (filenames
# include a content hash so they're safe to cache forever).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
